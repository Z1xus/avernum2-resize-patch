name: Build

on:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - run: cargo build --release --locked

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: avernum2-resize-patch
          path: target/release/avernum2-resize-patch.exe
          if-no-files-found: error

      - if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$env:GITHUB_REF_NAME" target/release/avernum2-resize-patch.exe --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
